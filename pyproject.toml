[project]
name = "flask_resume"
version = "0.1.0"
description = "Flask + PostgreSQL resume website"
requires-python = ">=3.11"

dependencies = [
    "flask>=3.1.2",
    "flask-sqlalchemy>=3.1.1",
    "psycopg2-binary>=2.9.10",
    "flask-wtf>=1.2.2",
    "wtforms>=3.2.1",
    "gunicorn>=23.0.0",
    "email-validator>=2.3.0",
    "sqlalchemy>=2.0.43",
    "werkzeug>=3.1.3"
]
